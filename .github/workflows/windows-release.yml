name: Windows build verification

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --version=6.7.1 --yes --no-progress
      - name: Build, test, and package (no release publication)
        id: package
        shell: powershell
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            .\scripts\build-release.ps1 -Version ($env:GITHUB_REF_NAME -replace '^v', '')
          } else {
            .\scripts\build-release.ps1
          }
      - name: Retain this run's review artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-review-build
          if-no-files-found: error
          path: |
            ${{ steps.package.outputs.release_dir }}/*.zip
            ${{ steps.package.outputs.release_dir }}/*.exe
            ${{ steps.package.outputs.release_dir }}/*.pdf
            ${{ steps.package.outputs.release_dir }}/SHA256SUMS-*.txt
            ${{ steps.package.outputs.release_dir }}/release-manifest.json
