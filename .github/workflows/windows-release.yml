name: Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --version=6.7.1 --yes --no-progress
      - name: Build, test, and package
        shell: powershell
        run: |
          $releaseVersion = if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $env:GITHUB_REF_NAME -replace '^v', ''
          } else {
            '2.5.1'
          }
          .\scripts\build-release.ps1 -Version $releaseVersion
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          artifacts/*.zip
          artifacts/SHA256SUMS-*.txt
          artifacts/installer/*.exe
          --title "Dym&D Asset Companion ${{ github.ref_name }}"
          --generate-notes
